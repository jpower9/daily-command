name: TestFlight

# Archives Daily Command on a GitHub Mac and uploads it to App Store Connect. Run it by hand
# (Actions → TestFlight → Run workflow) from main. The build number is the run number, so every
# upload is higher than the last.
#
# Needs, once, in the repo settings:
#   Secret:    ASC_KEY_P8                   contents of the team's App Store Connect API key (.p8)
#   Variables: ASC_KEY_ID, ASC_ISSUER_ID    the key's id and the team's issuer id (identifiers, not secrets)
#              DC_SUPABASE_PUBLISHABLE_KEY  the Supabase publishable key (sb_publishable_…; not a secret,
#                                           but kept out of git)
# and, in App Store Connect, an app record for com.execclone.dailycommand named "Daily Command".

on:
  workflow_dispatch:
    inputs:
      build_offset:
        description: "Added to the run number to form the build number (bump if a lower number was already uploaded)"
        required: false
        default: "0"

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Check configuration
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ vars.ASC_KEY_ID }}
          ISS: ${{ vars.ASC_ISSUER_ID }}
          PUB: ${{ vars.DC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=""
          [ -n "$P8" ]  || missing="$missing ASC_KEY_P8"
          [ -n "$KID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ISS" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$PUB" ] || missing="$missing DC_SUPABASE_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing repo settings:$missing (see the comment at the top of this workflow)"; exit 1; fi
      - name: Write Local.xcconfig and the API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ vars.ASC_KEY_ID }}
          PUB: ${{ vars.DC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          printf 'DC_SUPABASE_PUBLISHABLE_KEY = %s\n' "$PUB" > ios/Config/Local.xcconfig
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$KID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$KID.p8"
      - name: Archive, brand-check and upload
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
        run: |
          BUILD=$(( ${{ github.run_number }} + ${{ github.event.inputs.build_offset || 0 }} ))
          echo "Build number $BUILD"
          scripts/release.sh "$BUILD"
      - name: Upload archive log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: /tmp/daily-command-release-*/archive.log
          if-no-files-found: ignore
      - name: Remove the key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect" ios/Config/Local.xcconfig
